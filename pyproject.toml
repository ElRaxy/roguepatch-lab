[project]
name = "roguepatch-lab"
version = "0.0.0"
description = "Adversarial conformance spike for external coding-agent controls"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rfc8785>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"

[tool.mypy]
mypy_path = "src"
python_version = "3.12"
strict = true
